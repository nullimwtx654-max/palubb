name: Build PocketPal APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      RNLLAMA_SKIP_POSTINSTALL: '1'
      PLUS_STORE_GATE: 'true'
      APP_RELEASE_STORE_PASSWORD: dummy-ci-password
      APP_RELEASE_KEY_PASSWORD: dummy-ci-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Project Root & Line Endings
        run: |
          if [ ! -f package.json ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Detected project inside subdirectory $SUBDIR — moving to workspace root..."
              shopt -s dotglob
              mv "$SUBDIR"/* . || true
              shopt -u dotglob
            fi
          fi
          find . \( -name "*.sh" -o -name "*.patch" -o -name "gradlew" -o -name ".env" \) -not -path "*/node_modules/*" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          chmod +x scripts/*.sh android/gradlew 2>/dev/null || true

      # Must precede setup-node and setup-java because /opt/hostedtoolcache is where those install
      - name: Maximize Build Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Install Yarn & Dependencies
        run: |
          npm install -g yarn || true
          yarn install

      - name: Configure rnllama Variants
        run: |
          if [ -f scripts/verify-android-payload.js ]; then
            VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          else
            VARIANTS="rnllama,rnllama_v8,rnllama_v8_2,rnllama_v8_2_dotprod,rnllama_v8_2_dotprod_i8mm,rnllama_v8_2_dotprod_i8mm_hexagon_opencl,rnllama_x86_64"
          fi
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Provision Hexagon SDK (Self-Contained)
        run: |
          set -euo pipefail
          HEXAGON_SDK_VERSION="6.4.0.2"
          HEXAGON_TOOLS_VERSION="19.0.04"
          SDK_ROOT="$HOME/.hexagon-sdk/$HEXAGON_SDK_VERSION"
          TOOLS_ROOT="$SDK_ROOT/tools/HEXAGON_Tools/$HEXAGON_TOOLS_VERSION"
          if [ ! -d "$SDK_ROOT" ]; then
            STAGE=$(mktemp -d)
            echo "Downloading Hexagon SDK $HEXAGON_SDK_VERSION..."
            curl -fsSL -o "$STAGE/sdk.tar.xz" \
              "https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v${HEXAGON_SDK_VERSION}/hexagon-sdk-v${HEXAGON_SDK_VERSION}-amd64-lnx.tar.xz"
            mkdir -p "$STAGE/unpacked"
            tar --use-compress-program='xz -T0 -d' -xf "$STAGE/sdk.tar.xz" -C "$STAGE/unpacked"
            rm -f "$STAGE/sdk.tar.xz"
            mkdir -p "$HOME/.hexagon-sdk"
            if [ -d "$STAGE/unpacked/incs" ]; then
              mv "$STAGE/unpacked" "$SDK_ROOT"
            else
              INNER=$(find "$STAGE/unpacked" -maxdepth 1 -mindepth 1 -type d | head -n 1)
              mv "$INNER" "$SDK_ROOT"
            fi
          fi
          echo "HEXAGON_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "HEXAGON_TOOLS_ROOT=$TOOLS_ROOT" >> "$GITHUB_ENV"

      - name: Ensure google-services.json Exists
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.pocketpalai.e2e"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              }
            ]
          }
          EOL

      - name: Ensure .env File Exists
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          APP_RELEASE_STORE_PASSWORD=dummy-ci-password
          APP_RELEASE_KEY_PASSWORD=dummy-ci-password
          EOL

      - name: Ensure Release Keystore Exists
        working-directory: android/app
        run: |
          if [ ! -f pocketpal-release-key.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore pocketpal-release-key.keystore \
              -alias pocketpal_key_alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dummy-ci-password \
              -keypass dummy-ci-password \
              -dname "CN=CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"
          fi

      - name: Build Android Prod Release APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          bash ./gradlew assembleProdRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          fi
          echo "Built APK at: $APK_PATH"
          cp "$APK_PATH" pocketpal-ai-release.apk
          ls -lh pocketpal-ai-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-ai-release-apk
          path: pocketpal-ai-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.22.0-enhanced-${{ github.run_number }}
          name: PocketPal AI Enhanced Release (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          files: pocketpal-ai-release.apk
